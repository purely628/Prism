upstream prism_gateway {
    server prism-gateway:8080;
    keepalive 32;
}

# /v1 接入层限流：每 IP 50r/s，突发 100（业务级限流在网关按应用 Key 做）
limit_req_zone $binary_remote_addr zone=v1_limit:10m rate=50r/s;

server {
    listen 80;
    server_name _;

    # 前端静态资源（SPA 回退）
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # ---------- 反代网关：API 与 OpenAI 兼容入口 ----------
    location /api/ {
        proxy_pass http://prism_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    location /v1/ {
        limit_req zone=v1_limit burst=100 nodelay;
        proxy_pass http://prism_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE 三件套：不缓冲 / 不缓存 / 长读超时——少一个都会"整包一次性吐出"或"60s 掐断"
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header Connection "";
        add_header X-Accel-Buffering no;
    }

    # /internal 只允许内网（本部署中外部根本不该有到网关的 /internal 流量，网关也会拒绝）
    location /internal/ {
        deny all;
    }

    gzip on;
    gzip_types text/css application/javascript application/json;
    # 注意：text/event-stream 不做 gzip（会破坏流式语义）
}
