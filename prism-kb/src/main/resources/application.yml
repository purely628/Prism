server:
  port: 8104

spring:
  application:
    name: prism-kb
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${PRISM_MYSQL_HOST:127.0.0.1}:${PRISM_MYSQL_PORT:3306}/prism?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${PRISM_MYSQL_USER:root}
    password: ${PRISM_MYSQL_PASSWORD:1234}
  data:
    redis:
      host: ${PRISM_REDIS_HOST:127.0.0.1}
      port: ${PRISM_REDIS_PORT:6379}
      timeout: 10s
  rabbitmq:
    host: ${RABBIT_HOST:127.0.0.1}
    port: 5672
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

prism:
  worker-id: ${PRISM_WORKER_ID:5}
  mq:
    mode: ${MQ_MODE:stream}
  agent-url: ${PRISM_AGENT_URL:http://127.0.0.1:8200}
  kb:
    storage: ${PRISM_KB_STORAGE:./data/kb}
