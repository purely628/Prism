# compose profile：数据源/Redis/Nacos 全部走环境变量覆盖（容器服务名）
spring:
  datasource:
    url: jdbc:mysql://${PRISM_MYSQL_HOST:mysql}:${PRISM_MYSQL_PORT:3306}/prism?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${PRISM_MYSQL_USER:root}
    password: ${PRISM_MYSQL_PASSWORD:1234}
  data:
    redis:
      host: ${PRISM_REDIS_HOST:redis}
      port: ${PRISM_REDIS_PORT:6379}
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
